name: Extract source ZIP
on:
  push:
    branches: [main]
    paths-ignore:
      - 'extracted-source/**'
jobs:
  extract:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout private repository
        uses: actions/checkout@v4
      - name: Safely extract ZIP (do not run its contents)
        run: |
          python3 - <<'PY'
          from pathlib import Path
          from zipfile import ZipFile
          src = Path("FUCK IOS DEV.zip")
          dest = Path("extracted-source").resolve()
          dest.mkdir(parents=True, exist_ok=True)
          with ZipFile(src) as z:
              for info in z.infolist():
                  target = (dest / info.filename).resolve()
                  if target != dest and dest not in target.parents:
                      raise SystemExit(f"Unsafe ZIP path: {info.filename}")
                  if info.is_dir():
                      target.mkdir(parents=True, exist_ok=True)
                  else:
                      target.parent.mkdir(parents=True, exist_ok=True)
                      with z.open(info) as inp, target.open("wb") as out:
                          while chunk := inp.read(1024 * 1024):
                              out.write(chunk)
          print("Extracted", sum(1 for p in dest.rglob("*") if p.is_file()), "files")
          PY
      - name: Commit extracted folder to the private repository
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add extracted-source/
          if ! git diff --cached --quiet; then
            git commit -m "Add extracted source folder"
            git push
          else
            echo "No extracted-file changes to commit"
          fi
      - name: Upload extracted files as a private workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: extracted-source
          path: extracted-source/
          if-no-files-found: error
          retention-days: 7
